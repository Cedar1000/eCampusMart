$kind: http-request
url: "{{URL}}/product-stores"
method: POST
body:
  type: json
  content: |-
    {
        "categoryId": "3253bb0e-8c0a-4376-aaa5-f2482d3e0b76",
        "name": "Campus Electronics Store",
        "description": "A store selling phones, laptops, chargers, and other electronics.",
        "logo": "https://cdn.example.com/service-stores/sweet-crumbs/logo.png",
        "logoKey": "service-stores/sweet-crumbs/logo.png",
        "banner": "https://cdn.example.com/service-stores/sweet-crumbs/banner.png",
        "bannerKey": "service-stores/sweet-crumbs/banner.png"
    }
auth:
  type: bearer
  credentials:
    token: "{{jwt}}"
examples: ./.resources/Create Product Store.resources/examples
order: 2000
