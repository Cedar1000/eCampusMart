$kind: http-request
description: |-
  Saves the phone's Expo push token for the signed-in user. Send it after every sign-in and whenever the token changes. 201 for a new token, 200 for one the server already had; no body. A token another user had moves to this user. See docs/NOTIFICATIONS.md for the push types.
url: "{{URL}}/notifications/push-tokens"
method: POST
body:
  type: json
  content: |-
    {
        "token": "ExponentPushToken[xxxxxxxxxxxxxxxxxxxxxx]",
        "platform": "android"
    }
auth:
  type: bearer
  credentials:
    token: "{{jwt}}"
examples: ./.resources/Save Push Token.resources/examples
order: 1000
