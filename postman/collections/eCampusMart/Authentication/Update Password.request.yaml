$kind: http-request
url: "{{URL}}/auth/update-password"
method: PATCH
body:
  type: json
  content: "{\r

    \    \"currentPassword\": \"test12345\",\r

    \    \"newPassword\": \"test1234\",\r

    \    \"newConfirmPassword\": \"test1234\"\r

    }"
auth:
  type: bearer
  credentials:
    token: "{{jwt}}"
settings: {}
examples: ./.resources/Update Password.resources/examples
order: 3000
